{% extends "base.html" %}
{% block title %}New Work Order{% endblock %}

{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-bold text-gray-900">Create Work Order</h1>
  <p class="text-gray-500">Enter the job details below</p>
</div>

<form method="POST" class="bg-white rounded-xl shadow-sm border p-6 space-y-6">
  <!-- Priority & Type -->
  <div class="grid sm:grid-cols-2 gap-5">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Priority *</label>
      <select name="priority" class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none">
        <option value="Normal" selected>Normal</option>
        <option value="High">High</option>
        <option value="Emergency">Emergency</option>
        <option value="Low">Low</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Job Type *</label>
      <select name="job_type" required class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none">
        <option value="">Select type...</option>
        <optgroup label="HVAC">
          <option value="AC Repair">AC Repair</option>
          <option value="AC Install">AC Install</option>
          <option value="Furnace Repair">Furnace Repair</option>
          <option value="Furnace Install">Furnace Install</option>
          <option value="Heat Pump Repair">Heat Pump Repair</option>
          <option value="Heat Pump Install">Heat Pump Install</option>
          <option value="Ductwork">Ductwork</option>
          <option value="Mini-Split">Mini-Split / Ductless</option>
          <option value="Maintenance Tune-up">Maintenance / Tune-up</option>
          <option value="Commercial HVAC">Commercial HVAC</option>
        </optgroup>
        <optgroup label="Electrical">
          <option value="Panel Upgrade">Panel Upgrade</option>
          <option value="EV Charger">EV Charger Installation</option>
          <option value="Generator">Whole-Home Generator</option>
          <option value="Wiring Repair">Wiring / Repair</option>
          <option value="New Construction Electrical">New Construction Electrical</option>
          <option value="Commercial Electrical">Commercial Electrical</option>
          <option value="Emergency Electric">Emergency Electric</option>
        </optgroup>
        <option value="Other">Other</option>
      </select>
    </div>
  </div>

  <!-- Customer -->
  <div class="border-t pt-5">
    <h3 class="font-semibold text-gray-800 mb-3">Customer Information</h3>
    <div class="grid sm:grid-cols-2 gap-5">
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Customer Name *</label>
        <input type="text" name="customer_name" required value="{{ form.customer_name or '' }}"
               class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none"
               placeholder="John Smith">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
        <input type="tel" name="customer_phone" value="{{ form.customer_phone or '' }}"
               class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none"
               placeholder="(540) 555-1234">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="customer_email" value="{{ form.customer_email or '' }}"
               class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Service Address *</label>
        <input type="text" name="service_address" required value="{{ form.service_address or '' }}"
               class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none"
               placeholder="123 Main St">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
        <input type="text" name="city" value="{{ form.city or 'Staunton' }}"
               class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none">
      </div>
    </div>
  </div>

  <!-- Job details -->
  <div class="border-t pt-5">
    <h3 class="font-semibold text-gray-800 mb-3">Job Details</h3>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description of Work / Problem</label>
        <textarea name="description" rows="3"
                  class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none"
                  placeholder="Customer reports no cool air. Unit is 12 years old...">{{ form.description or '' }}</textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Equipment Info (make / model / serial if known)</label>
        <input type="text" name="equipment_info" value="{{ form.equipment_info or '' }}"
               class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none"
               placeholder="RUUD UACL-036JAZ / Serial ABC123">
      </div>
      <div class="grid sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Assign Technician</label>
          <select name="assigned_to" class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none">
            <option value="">— Unassigned —</option>
            {% for t in techs %}
            <option value="{{ t.id }}">{{ t.full_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Scheduled Date</label>
          <input type="date" name="scheduled_date"
                 class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Internal Notes</label>
        <textarea name="notes" rows="2"
                  class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-callison-500 outline-none"
                  placeholder="Gate code, dog in yard, etc.">{{ form.notes or '' }}</textarea>
      </div>
    </div>
  </div>

  <div class="flex gap-3 pt-2">
    <button type="submit" class="bg-callison-700 hover:bg-callison-800 text-white px-6 py-2.5 rounded-lg font-medium">
      Create Work Order
    </button>
    <a href="{{ url_for('dashboard') }}" class="px-6 py-2.5 border rounded-lg text-gray-600 hover:bg-gray-50">Cancel</a>
  </div>
</form>
{% endblock %}
