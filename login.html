{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
  <div class="bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-callison-800">Callison Work Orders</h1>
      <p class="text-gray-500 mt-1">Employee login</p>
    </div>

    <form method="POST" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" name="username" required autofocus
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-callison-500 focus:border-callison-500 outline-none"
               placeholder="admin or tech username">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-callison-500 focus:border-callison-500 outline-none">
      </div>
      <button type="submit"
              class="w-full bg-callison-700 hover:bg-callison-800 text-white font-semibold py-3 rounded-lg transition">
        Sign In
      </button>
    </form>

    <div class="mt-8 pt-6 border-t text-xs text-gray-500 space-y-1">
      <p class="font-medium text-gray-600">Demo accounts:</p>
      <p><strong>admin</strong> / callison2026 (Andrew / Office)</p>
      <p><strong>melissa</strong> / office123 (Office)</p>
      <p><strong>jimmy</strong> / tech123 (Technician)</p>
      <p><strong>tech1</strong> or <strong>tech2</strong> / tech123</p>
    </div>
  </div>
</div>
{% endblock %}
